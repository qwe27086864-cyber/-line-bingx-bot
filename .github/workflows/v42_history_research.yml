
name: R1 Full Market July August September Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - v42-historical-backtest
    paths:
      - ".github/workflows/v42_history_research.yml"

permissions:
  contents: read

jobs:
  r1-backtest:
    name: R1 ${{ matrix.month }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - month: "2026-07"
            start: "2026-07-01T00:00:00Z"
            end: "2026-08-01T00:00:00Z"
          - month: "2026-08"
            start: "2026-08-01T00:00:00Z"
            end: "2026-09-01T00:00:00Z"
          - month: "2026-09"
            start: "2026-09-01T00:00:00Z"
            end: "2026-10-01T00:00:00Z"

    env:
      MONTH: ${{ matrix.month }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v42-historical-backtest

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare research
        run: |
          mkdir -p research/raw
          mkdir -p research/spread
          mkdir -p research/original
          mkdir -p research/report

      - name: Discover historical candidates
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          BASE = "https://open-api.bingx.com"

          def api(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "R1-Research/1.0"}
              )
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(
                          req, timeout=30
                      ) as response:
                          body = json.load(response)
                      if str(body.get("code")) != "0":
                          raise RuntimeError(str(body))
                      return body.get("data")
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(min(20, 2 ** attempt))

          contracts = api(
              "/openApi/swap/v2/quote/contracts"
          )

          symbols = sorted({
              item["symbol"]
              for item in contracts
              if isinstance(item, dict)
              and item.get("symbol", "").endswith("-USDT")
          })

          # Include warmup history before the month.
          start = datetime.fromisoformat(
              os.environ["START"].replace("Z", "+00:00")
          )
          warmup = start - timedelta(hours=72)
          probe_ms = int(warmup.timestamp() * 1000)

          available = []
          unavailable = []
          errors = []

          for i, symbol in enumerate(symbols, 1):
              try:
                  data = api(
                      "/openApi/swap/v3/quote/klines",
                      {
                          "symbol": symbol,
                          "interval": "1m",
                          "startTime": probe_ms,
                          "endTime": probe_ms + 3600000 - 1,
                          "limit": 60
                      }
                  )
                  if data:
                      available.append(symbol)
                  else:
                      unavailable.append(symbol)
              except Exception as error:
                  errors.append({
                      "symbol": symbol,
                      "error": str(error)[:200]
                  })

              if i % 100 == 0:
                  print(
                      "Probed", i, "/", len(symbols),
                      "available", len(available),
                      flush=True
                  )
              time.sleep(0.12)

          manifest = {
              "month": os.environ["MONTH"],
              "current_contract_count": len(symbols),
              "probe_available": len(available),
              "probe_unavailable": len(unavailable),
              "probe_errors": errors,
              "symbols": available,
              "historical_universe_complete": False,
              "limitations": [
                  "Delisted historical contracts may be missing",
                  "A warmup probe is not a complete listing history",
                  "Historical bid/ask spreads are unavailable"
              ]
          }

          Path("research/universe.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8"
          )

          print("Available:", len(available))
          print("Errors:", len(errors))

          if errors:
              print("Some probes failed; see manifest.")

          if not available:
              raise RuntimeError(
                  "No historical candidates available"
              )
          PY

      - name: Download historical 1m candles
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import time
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          from v42_download_bingx_history import (
              download,
              parse_utc,
              FIELDS
          )

          manifest = json.loads(
              Path("research/universe.json").read_text()
          )

          symbols = manifest["symbols"]
          month_start = datetime.fromisoformat(
              os.environ["START"].replace("Z", "+00:00")
          )
          warmup = month_start - timedelta(hours=72)

          start = int(warmup.timestamp() * 1000)
          end = parse_utc(os.environ["END"])
          expected = (end - start) // 60000

          results = []

          for i, symbol in enumerate(symbols, 1):
              try:
                  bars, missing = download(
                      symbol, start, end
                  )

                  if missing or len(bars) != expected:
                      results.append({
                          "symbol": symbol,
                          "status": "INCOMPLETE",
                          "bars": len(bars),
                          "missing": len(missing)
                      })
                      continue

                  path = Path(
                      "research/raw"
                  ) / (symbol + ".csv")

                  with path.open(
                      "w", newline="", encoding="utf-8"
                  ) as file:
                      writer = csv.DictWriter(
                          file, fieldnames=FIELDS
                      )
                      writer.writeheader()
                      writer.writerows(bars)

                  results.append({
                      "symbol": symbol,
                      "status": "COMPLETE",
                      "bars": len(bars)
                  })

              except Exception as error:
                  results.append({
                      "symbol": symbol,
                      "status": "ERROR",
                      "detail": str(error)[:300]
                  })

              print(
                  i, "/", len(symbols),
                  results[-1],
                  flush=True
              )
              time.sleep(0.3)

          Path(
              "research/download_manifest.json"
          ).write_text(
              json.dumps(results, indent=2),
              encoding="utf-8"
          )

          complete = sum(
              x["status"] == "COMPLETE"
              for x in results
          )

          print("Complete:", complete)
          print("Attempted:", len(symbols))

          if complete == 0:
              raise RuntimeError(
                  "No complete historical datasets"
              )
          PY

      - name: Retrieve original R1 code
        run: |
          python v42_prepare_sources.py \
            --out research/original

      - name: Prepare assumed spread
        run: |
          python v42_cost_scenario.py \
            --source research/raw \
            --out research/spread \
            --spread-pct 0.15

      - name: Run original R1 historical replay
        run: |
          python -u v42_run_offline_phase5.py \
            --original-app \
              research/original/original_app.py \
            --original-scanner \
              research/original/original_scanner_job.py \
            --candles research/spread \
            --out research/report

      - name: Mark research limitations
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("research/report/report.json")
          report = json.loads(path.read_text())
          universe = json.loads(
              Path("research/universe.json").read_text()
          )
          downloads = json.loads(
              Path("research/download_manifest.json").read_text()
          )

          complete = sum(
              r["status"] == "COMPLETE"
              for r in downloads
          )

          report["research_validation"] = {
              "historical_full_market_proven": False,
              "original_R1_signal_functions": True,
              "execution_parity_verified": False,
              "candidate_symbols": len(universe["symbols"]),
              "complete_symbols": complete,
              "spread": "Assumed 0.15%, not observed",
              "warning":
                  "Research proxy; not verified live-R1 parity"
          }

          path.write_text(
              json.dumps(
                  report, indent=2, ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(json.dumps(
              report["overall"],
              indent=2,
              ensure_ascii=False
          ))
          PY

      - name: Save results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-three-month-${{ matrix.month }}
          path: |
            research/universe.json
            research/download_manifest.json
            research/original/source_manifest.json
            research/report/
          retention-days: 14
          if-no-files-found: warn
