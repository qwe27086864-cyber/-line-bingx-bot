
name: R1 August US BILL Backtest

on:
  push:
    branches:
      - v42-historical-backtest
    paths:
      - '.github/workflows/v42_history_research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout historical backtest branch
        uses: actions/checkout@v4
        with:
          ref: v42-historical-backtest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run August historical backtest
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q v42_*.py

          python v42_one_shot.py \
            --symbols US-USDT BILL-USDT \
            --start 2026-08-01T00:00:00Z \
            --end 2026-09-01T00:00:00Z \
            --workdir r1_august_study \
            --plan-only

          python v42_one_shot.py \
            --symbols US-USDT BILL-USDT \
            --start 2026-08-01T00:00:00Z \
            --end 2026-09-01T00:00:00Z \
            --workdir r1_august_study

      - name: Save August backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-august-us-bill-results
          path: r1_august_study/
          if-no-files-found: warn
          retention-days: 14
