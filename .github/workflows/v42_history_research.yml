
name: R1 September Historical OHLCV Download Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-check:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v42-historical-backtest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download September pilot including indicator warmup
        shell: bash
        run: |
          set -euo pipefail

          python v42_download_bingx_history.py \
            --symbols 0G-USDT 1000BONK-USDT 1000PEPE-USDT 1INCH-USDT AAVE-USDT ADA-USDT AERO-USDT AEVO-USDT AGLD-USDT AIO-USDT AIXBT-USDT AKE-USDT \
            --start 2026-08-29T00:00:00Z \
            --end 2026-09-08T00:00:00Z \
            --out r1_september_pilot

      - name: Summarize data completeness
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          p = Path('r1_september_pilot')
          p.mkdir(exist_ok=True)

          result = []

          for f in sorted(p.glob('*-USDT.csv')):
              with f.open(newline='') as h:
                  reader = csv.DictReader(h)
                  count = sum(1 for _ in reader)

              result.append({
                  'symbol': f.stem,
                  'bars': count,
                  'expected_bars': 14400,
                  'complete': count == 14400
              })

          summary = {
              'scope': 'PIPELINE_TEST_NOT_BACKTEST',
              'period_utc': '2026-08-29 through 2026-09-08',
              'symbols': result,
              'no_trading': True
          }

          (p / 'pilot_summary.json').write_text(
              json.dumps(summary, indent=2)
          )

          print(json.dumps(result, indent=2))
          PY

      - name: Upload historical data and completeness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-september-1m-pilot-data
          path: r1_september_pilot/
          if-no-files-found: warn
          retention-days: 14
