
name: V6 July Historical Data Check

on:
  push:
    branches:
      - v42-historical-backtest
    paths:
      - '.github/workflows/v42_history_research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  july-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v42-historical-backtest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check July historical candles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from v42_download_bingx_history import request_page

          symbols = ["US-USDT", "BILL-USDT", "TERMMAX-USDT"]
          dates = [
              "2026-07-01T12:00:00Z",
              "2026-07-15T12:00:00Z",
              "2026-07-31T12:00:00Z",
          ]

          results = []

          for symbol in symbols:
              checks = []

              for date in dates:
                  start = int(
                      datetime.fromisoformat(
                          date.replace("Z", "+00:00")
                      ).timestamp() * 1000
                  )

                  try:
                      candles = request_page(
                          symbol,
                          start,
                          start + 60 * 60000,
                          limit=60,
                          tries=2,
                      )
                      count = len(candles)
                      status = (
                          "PASS" if count == 60
                          else "INCOMPLETE"
                      )
                  except Exception as error:
                      count = 0
                      status = "ERROR"
                      print(
                          symbol, date, str(error),
                          flush=True,
                      )

                  checks.append({
                      "date": date,
                      "candles": count,
                      "status": status,
                  })

                  print(
                      symbol, date, status, count,
                      flush=True,
                  )

              results.append({
                  "symbol": symbol,
                  "checks": checks,
                  "sample_pass": all(
                      item["status"] == "PASS"
                      for item in checks
                  ),
              })

          Path("july_data_check.json").write_text(
              json.dumps(results, indent=2),
              encoding="utf-8",
          )

          print("JULY_CHECK_COMPLETE", flush=True)
          PY

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-july-data-check
          path: july_data_check.json
          if-no-files-found: warn
          retention-days: 14
