
name: R1 12-Coin Original Signal Pilot

on:
  push:
    branches:
      - v42-historical-backtest
    paths:
      - '.github/workflows/v42_history_research.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-r1-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: v42-historical-backtest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reuse previously downloaded historical data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p study/raw

          gh run download 38526388381 \
            -n r1-september-12coin-history \
            -D study/raw

          python - <<'PY'
          import csv
          from pathlib import Path

          files = sorted(
              Path("study/raw").glob("*-USDT.csv")
          )

          assert len(files) == 12, (
              f"Expected 12 coins, got {len(files)}"
          )

          for file in files:
              with file.open(newline="") as f:
                  count = sum(
                      1 for _ in csv.DictReader(f)
                  )

              assert count == 14400, (
                  f"{file.name}: {count} bars"
              )

          print("12 coins verified")
          PY

      - name: Get original R1 strategy source
        shell: bash
        run: |
          set -euo pipefail

          python v42_prepare_sources.py \
            --out study/original

      - name: Prepare assumed spread research data
        shell: bash
        run: |
          set -euo pipefail

          python v42_cost_scenario.py \
            --source study/raw \
            --out study/assumed_spread \
            --spread-pct 0.15

      - name: Run original R1 historical signal replay
        shell: bash
        run: |
          set -euo pipefail

          python v42_run_offline_phase5.py \
            --original-app \
              study/original/original_app.py \
            --original-scanner \
              study/original/original_scanner_job.py \
            --candles study/assumed_spread \
            --out study/report

      - name: Add research limitations
        if: always()
        shell: bash
        run: |
          mkdir -p study/report

          cat > study/report/READ_ME_FIRST.txt <<'EOF'
          R1 historical research pilot.

          Period: 2026-08-29 to 2026-09-08 UTC
          Symbols: 12 fixed test symbols

          Uses original V4.2R1 signal functions.

          Historical ticker data is reconstructed.
          Spread of 0.15% is assumed, not observed.
          Execution remains a historical proxy.

          This is NOT a full-market R1 backtest.
          This is NOT proof of profitability.
          No live trading is enabled.
          Existing Render services are unchanged.
          EOF

      - name: Upload R1 research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-12coin-original-signal-pilot
          path: |
            study/report/
            study/original/source_manifest.json
            study/assumed_spread/ASSUMED_SPREAD_MANIFEST.json
          retention-days: 14
          if-no-files-found: warn
