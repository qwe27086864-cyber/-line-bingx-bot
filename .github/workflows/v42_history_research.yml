
name: R1 September Historical Radar Batch 01

on:
  push:
    branches:
      - v42-historical-backtest
    paths:
      - '.github/workflows/v42_history_research.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  historical-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v42-historical-backtest

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load repaired universe
        run: |
          set -euo pipefail

          mkdir -p research/universe
          mkdir -p research/raw
          mkdir -p research/original
          mkdir -p research/report

          gh run download 38532806846 \
            -n r1-september-universe-repaired \
            -D research/universe

          test -s \
            research/universe/evidence_repaired.csv

      - name: Select historical candidate batch
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          with open(
              "research/universe/evidence_repaired.csv",
              encoding="utf-8-sig",
          ) as f:
              rows = list(csv.DictReader(f))

          candidates = {
              r["symbol"]
              for r in rows
              if r["day"] == "2026-09-01"
              and r["status"] == "HAS_HISTORY"
          }

          candidates = sorted(
              candidates,
              key=lambda s: hashlib.sha256(
                  ("R1-SEP-2026:" + s).encode()
              ).hexdigest(),
          )

          assert len(candidates) >= 20

          selected = candidates[:20]

          Path(
              "research/selected.json"
          ).write_text(
              json.dumps({
                  "candidate_count": len(candidates),
                  "selected": selected,
                  "selection_method":
                      "Deterministic sample, not R1 signals",
              }, indent=2),
              encoding="utf-8",
          )

          print("Candidates:", len(candidates))
          print("Selected:", selected)
          PY

      - name: Download complete 1m history
        run: |
          python - <<'PY'
          import csv
          import json
          import time

          from pathlib import Path

          from v42_download_bingx_history import (
              download,
              parse_utc,
              FIELDS,
          )

          symbols = json.loads(
              Path(
                  "research/selected.json"
              ).read_text()
          )["selected"]

          start = parse_utc(
              "2026-09-01T00:00:00Z"
          )

          end = parse_utc(
              "2026-09-11T00:00:00Z"
          )

          results = []

          for i, symbol in enumerate(symbols, 1):
              try:
                  bars, missing = download(
                      symbol,
                      start,
                      end,
                  )

                  if missing or len(bars) != 14400:
                      results.append({
                          "symbol": symbol,
                          "status": "INCOMPLETE",
                          "bars": len(bars),
                          "missing": len(missing),
                      })
                      continue

                  with open(
                      "research/raw/" + symbol + ".csv",
                      "w",
                      newline="",
                  ) as f:
                      writer = csv.DictWriter(
                          f,
                          fieldnames=FIELDS,
                      )
                      writer.writeheader()
                      writer.writerows(bars)

                  results.append({
                      "symbol": symbol,
                      "status": "COMPLETE",
                      "bars": len(bars),
                  })

              except Exception as error:
                  results.append({
                      "symbol": symbol,
                      "status": "ERROR",
                      "detail": str(error)[:250],
                  })

              print(
                  i,
                  "/",
                  len(symbols),
                  results[-1],
                  flush=True,
              )

              time.sleep(0.5)

          Path(
              "research/download_manifest.json"
          ).write_text(
              json.dumps(results, indent=2),
              encoding="utf-8",
          )

          completed = sum(
              r["status"] == "COMPLETE"
              for r in results
          )

          assert completed >= 2, (
              "Insufficient historical data"
          )
          PY

      - name: Load original R1 source
        run: |
          python v42_prepare_sources.py \
            --out research/original

      - name: Prepare assumed spread
        run: |
          python v42_cost_scenario.py \
            --source research/raw \
            --out research/spread \
            --spread-pct 0.15

      - name: Run R1 historical replay
        run: |
          python v42_run_offline_phase5.py \
            --original-app \
              research/original/original_app.py \
            --original-scanner \
              research/original/original_scanner_job.py \
            --candles research/spread \
            --out research/report

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-september-historical-radar-batch01
          path: |
            research/selected.json
            research/download_manifest.json
            research/report/
            research/original/source_manifest.json
          retention-days: 14
          if-no-files-found: warn
