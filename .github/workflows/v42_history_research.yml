
name: R1 September Historical Universe Probe

on:
  push:
    branches:
      - v42-historical-backtest
    paths:
      - '.github/workflows/v42_history_research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  september-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: v42-historical-backtest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile \
            r1_september_universe_probe.py

      - name: Scan September historical coin universe
        run: |
          python -u r1_september_universe_probe.py \
            --out r1_september_universe \
            --max-symbols 0 \
            --workers 5

      - name: Show checkpoint summary
        if: success()
        run: |
          python - <<'PY'
          import json

          with open(
              "r1_september_universe/universe_evidence.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(
              "Total symbols:",
              data["total_symbols_checked"],
          )

          for day, count in data[
              "checkpoint_counts"
          ].items():
              print(day, count)

          print(
              "API errors:",
              len(data["errors"]),
          )
          PY

      - name: Upload historical universe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-september-universe-evidence
          path: r1_september_universe/
          retention-days: 14
          if-no-files-found: warn
