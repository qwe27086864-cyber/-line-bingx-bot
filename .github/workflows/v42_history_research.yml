
name: R1 August Small Coin Data Check

on:
  push:
    branches:
      - v42-historical-backtest
    paths:
      - '.github/workflows/v42_history_research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  august-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: v42-historical-backtest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check August historical candles
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          from v42_download_bingx_history import request_page

          symbols = [
              "US-USDT",
              "TERMMAX-USDT",
              "BILL-USDT",
          ]

          dates = [
              "2026-08-01T12:00:00Z",
              "2026-08-15T12:00:00Z",
              "2026-08-31T12:00:00Z",
          ]

          results = []

          for symbol in symbols:
              checks = []

              for date in dates:
                  start = int(
                      datetime.fromisoformat(
                          date.replace("Z", "+00:00")
                      ).timestamp() * 1000
                  )

                  try:
                      candles = request_page(
                          symbol,
                          start,
                          start + 60 * 60000,
                          limit=60,
                          tries=2,
                      )
                      n = len(candles)
                      status = (
                          "PASS" if n == 60 else "INCOMPLETE"
                      )
                  except Exception as error:
                      n = 0
                      status = "ERROR"
                      print(symbol, date, str(error), flush=True)

                  checks.append({
                      "date": date,
                      "candles": n,
                      "status": status,
                  })

                  print(symbol, date, status, n, flush=True)

              results.append({
                  "symbol": symbol,
                  "checks": checks,
                  "sample_pass": all(
                      c["status"] == "PASS" for c in checks
                  ),
              })

          Path("august_data_check.json").write_text(
              json.dumps(results, indent=2),
              encoding="utf-8",
          )

          print("AUGUST_CHECK_COMPLETE", flush=True)
          PY

      - name: Save diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-august-data-check
          path: august_data_check.json
          if-no-files-found: warn
          retention-days: 14
