services:
  - type: web
    name: market-research-recorder-final
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    branch: historical-router-v1
    autoDeployTrigger: off
    buildCommand: pip install 'psycopg[binary]'
    startCommand: python market_research_recorder_v2.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bingx-bot-db
          property: connectionString
      - key: TICK_SEC
        value: "15"
      - key: SIM_FEE_PER_SIDE_PCT
        value: "0.05"
      - key: MAX_ACTIVE
        value: "1200"
      - key: DEEP_PER_MIN
        value: "5"
      - key: NEGATIVE_PER_MIN
        value: "3"
      - key: WICK_PER_MIN
        value: "20"
      - key: COARSE_CACHE_SEC
        value: "60"

  - type: cron
    name: core-discovery-engine
    runtime: python
    plan: starter
    region: singapore
    branch: historical-router-v1
    schedule: "15 */6 * * *"
    buildCommand: pip install 'psycopg[binary]'
    startCommand: python core_discovery_engine.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bingx-bot-db
          property: connectionString
      - key: DISCOVERY_TRAIN_FRAC
        value: "0.70"
      - key: DISCOVERY_MIN_TRAIN
        value: "60"
      - key: DISCOVERY_MIN_OOS
        value: "20"
      - key: DISCOVERY_MIN_OBSERVED_HOURS
        value: "24"
      - key: DISCOVERY_CLIP_NET_PCT
        value: "5.0"
      - key: DISCOVERY_MIN_TRAIN_AVG
        value: "0.12"
      - key: DISCOVERY_MIN_OOS_AVG
        value: "0.08"
      - key: DISCOVERY_MIN_TRAIN_PF
        value: "1.15"
      - key: DISCOVERY_MIN_OOS_PF
        value: "1.10"
      - key: DISCOVERY_MIN_FILL
        value: "0.50"
      - key: DISCOVERY_PAPER_PASS_N
        value: "30"
      - key: DISCOVERY_LIVE_CANDIDATE_N
        value: "100"
      - key: DISCOVERY_LIVE_MIN_SPAN_HOURS
        value: "168"
